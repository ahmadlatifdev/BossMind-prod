name: BossMind secret scan
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets (paths only)
        shell: pwsh
        run: |
          if (Test-Path ./11-scripts/bossmind-secret-scan.ps1) {
            ./11-scripts/bossmind-secret-scan.ps1 -Root $PWD
          } else {
            Write-Error "bossmind-secret-scan.ps1 missing"
          }
