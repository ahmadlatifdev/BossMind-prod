# Deploy resumora-marketing-intel via GitHub Actions (BossMind monorepo)
# Secrets: GCP_PROJECT_ID, GCP_SA_KEY; optional GCP_BILLING_ACCOUNT, SLACK_WEBHOOK_URL
# Least-privilege SA recommended (not roles/editor). Never Ads Admin.

name: Marketing Intel Deploy

on:
  pull_request:
    paths:
      - "resumora-marketing-intel/**"
      - ".github/workflows/marketing-intel-deploy.yml"
  push:
    branches: [main]
    paths:
      - "resumora-marketing-intel/**"
      - ".github/workflows/marketing-intel-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Enable GCS backend for plan
        working-directory: resumora-marketing-intel/terraform
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=resumora-terraform-state-${{ secrets.GCP_PROJECT_ID }}" \
            -backend-config="prefix=marketing-intelligence"
      - name: Terraform Plan
        working-directory: resumora-marketing-intel/terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_enable_budget_alert: "false"
        run: terraform plan -input=false -no-color -var-file=prod.tfvars -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Terraform Plan — resumora-marketing-intel\n```\n';
            try {
              body += fs.readFileSync('resumora-marketing-intel/terraform/plan.txt','utf8').slice(0,60000);
            } catch (e) { body += String(e); }
            body += '\n```\nSocial ad campaigns are **not** modified.';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Build and push image
        working-directory: resumora-marketing-intel
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/resumora-mkt-intel:${{ github.sha }}"
          LATEST="gcr.io/${{ secrets.GCP_PROJECT_ID }}/resumora-mkt-intel:latest"
          gcloud builds submit --tag "$IMAGE"
          gcloud container images add-tag "$IMAGE" "$LATEST" --quiet || true
          echo "IMAGE=$LATEST" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Apply
        id: tf_apply
        working-directory: resumora-marketing-intel/terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_enable_budget_alert: "false"
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "gcs" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=resumora-terraform-state-${{ secrets.GCP_PROJECT_ID }}" \
            -backend-config="prefix=marketing-intelligence"
          terraform apply -input=false -auto-approve \
            -var-file=prod.tfvars \
            -var="cloud_run_image=${IMAGE}"
          terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

      - name: Extract Cloud Run URL
        id: get_url
        if: success()
        working-directory: resumora-marketing-intel/terraform
        run: |
          URL=$(terraform output -raw cloud_run_url 2>/dev/null || echo "Deployment completed, but URL not found in outputs")
          echo "cloud_run_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on Success
        uses: slackapi/slack-github-action@v1.27.0
        if: success()
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Marketing Intelligence Deployed Successfully"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nprod"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Dashboard URL:*\n${{ steps.get_url.outputs.cloud_run_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deployed By:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 Head over to the dashboard to check pricing insights, brand perception, and competitor alerts."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "ℹ️ Existing social media ad campaigns remain untouched by this deployment."
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@v1.27.0
        if: failure()
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Marketing Intelligence Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nprod"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Actor:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run Logs:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🛠️ Check the logs and Terraform plan to debug the issue. Social ad campaigns were not modified."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
