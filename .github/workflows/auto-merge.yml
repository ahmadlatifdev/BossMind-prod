name: Auto-resolve merge conflicts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auto-rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto-rebase (ours strategy)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git rebase origin/main --strategy-option=ours || git rebase --abort
      - name: Push if changed
        if: success()
        run: git push origin HEAD --force-with-lease
